<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>WOT Кредити</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Roboto+Condensed:wght@600;700&family=Roboto+Mono:wght@700&display=swap');

    :root {
      --orange: #FFA500;
      --orange2: #ff8c00;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: transparent;
    }

    body {
      font-family: 'Orbitron', sans-serif;
    }


    /* =========================================
       ОСНОВНИЙ ВІДЖЕТ
    ========================================= */

    .widget-box {
      width: fit-content;

      background: rgba(0, 0, 0, 0.65);

      border: 3px solid var(--orange);
      border-radius: 18px;

      box-shadow:
        0 0 22px rgba(255, 165, 0, 0.65),
        inset 0 0 15px rgba(255, 165, 0, 0.06);

      display: flex;
      flex-direction: column;
      align-items: center;

      padding: 18px 26px;
    }


    /* =========================================
       ЗАГОЛОВОК
    ========================================= */

    .header-text {
      font-size: 38px;
      font-weight: 700;

      color: var(--orange);

      margin-bottom: 14px;

      text-shadow:
        2px 2px 0 black,
        0 0 9px rgba(255, 165, 0, 0.85);
    }


    /* =========================================
       FLIP BOARD
    ========================================= */

    .main-flip-board {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      gap: 6px;

      background: rgba(0, 0, 0, 0.42);

      border: 2px solid var(--orange);
      border-radius: 11px;

      padding: 7px;

      box-shadow:
        inset 0 0 10px rgba(255, 165, 0, 0.30);

      overflow: hidden;
    }


    /* =========================================
       ОДНА ЦИФРА
    ========================================= */

    .flip-digit {
      position: relative;

      width: 68px;
      height: 96px;

      perspective: 520px;
      perspective-origin: 50% 50%;

      border-radius: 8px;

      background: #111;

      box-shadow:
        0 3px 7px rgba(0, 0, 0, 0.70),
        inset 0 1px 0 rgba(255, 255, 255, 0.035),
        inset 0 -1px 0 rgba(0, 0, 0, 0.85);

      overflow: hidden;

      font-family: Arial, Helvetica, sans-serif;
      font-weight: 700;

      color: #eeeeee;

      transform-style: preserve-3d;
    }


    /* центральна лінія */

    .flip-digit::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      top: calc(50% - 1px);

      height: 2px;

      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.96) 0%,
          rgba(28, 28, 28, 0.98) 48%,
          rgba(0, 0, 0, 0.96) 100%
        );

      box-shadow:
        0 -1px 0 rgba(255, 255, 255, 0.035),
        0 1px 2px rgba(0, 0, 0, 0.95);

      z-index: 30;

      pointer-events: none;
    }


    /* =========================================
       ВЕРХНЯ / НИЖНЯ ПОЛОВИНА
    ========================================= */

    .digit-half {
      position: absolute;

      left: 0;

      width: 100%;
      height: 50%;

      overflow: hidden;

      backface-visibility: hidden;
      transform-style: preserve-3d;
    }


    .digit-half.top {
      top: 0;

      border-radius: 8px 8px 0 0;

      background:
        linear-gradient(
          to bottom,
          #424242 0%,
          #292929 100%
        );
    }


    .digit-half.bottom {
      bottom: 0;

      border-radius: 0 0 8px 8px;

      background:
        linear-gradient(
          to bottom,
          #232323 0%,
          #171717 100%
        );
    }


    .digit-num {
      position: absolute;

      left: 0;

      width: 100%;
      height: 96px;

      line-height: 96px;

      text-align: center;

      font-size: 88px;
      font-weight: 700;

      color: #eeeeee;

      text-shadow: none;
    }


    .digit-half.top .digit-num {
      top: 0;
    }


    .digit-half.bottom .digit-num {
      bottom: 0;
    }


    /* =========================================
       FLIP АНІМАЦІЯ
    ========================================= */

    .static-top,
    .static-bottom {
      z-index: 1;
    }


    .flip-top {
      z-index: 12;

      transform-origin: 50% 100%;
      transform: rotateX(0deg);

      will-change: transform;
    }


    .flip-bottom {
      z-index: 11;

      transform-origin: 50% 0%;
      transform: rotateX(90deg);

      will-change: transform;
    }


    /*
      ТІНІ НА РУХОМИХ ПОЛОВИНАХ.

      Вони змінюються разом із кутом,
      тому цифра виглядає не як простий
      rotateX, а як справжня пластина.
    */

    .flip-top::after,
    .flip-bottom::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 5;
    }


    .flip-top::after {
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.00) 0%,
          rgba(0, 0, 0, 0.10) 42%,
          rgba(0, 0, 0, 0.72) 100%
        );

      opacity: 0;
    }


    .flip-bottom::after {
      background:
        linear-gradient(
          to bottom,
          rgba(0, 0, 0, 0.72) 0%,
          rgba(0, 0, 0, 0.16) 48%,
          rgba(255, 255, 255, 0.025) 100%
        );

      opacity: 1;
    }


    /*
      Реальний двоетапний переворот:

      1. стара верхня половина падає до центру;
      2. нова нижня половина розкривається від центру.
    */

    .flip-digit.play .flip-top {
      animation:
        flipTop 0.38s cubic-bezier(0.52, 0.02, 0.82, 0.48) forwards;
    }


    .flip-digit.play .flip-top::after {
      animation:
        flipTopShadow 0.38s ease-in forwards;
    }


    .flip-digit.play .flip-bottom {
      animation:
        flipBottom 0.40s cubic-bezier(0.18, 0.58, 0.34, 1.00) 0.30s forwards;
    }


    .flip-digit.play .flip-bottom::after {
      animation:
        flipBottomShadow 0.40s ease-out 0.30s forwards;
    }


    @keyframes flipTop {

      0% {
        transform: rotateX(0deg);
      }

      35% {
        transform: rotateX(-28deg);
      }

      72% {
        transform: rotateX(-67deg);
      }

      100% {
        transform: rotateX(-90deg);
      }

    }


    @keyframes flipTopShadow {

      0% {
        opacity: 0.05;
      }

      55% {
        opacity: 0.62;
      }

      100% {
        opacity: 1;
      }

    }


    @keyframes flipBottom {

      0% {
        transform: rotateX(90deg);
      }

      30% {
        transform: rotateX(64deg);
      }

      68% {
        transform: rotateX(22deg);
      }

      88% {
        transform: rotateX(-3deg);
      }

      100% {
        transform: rotateX(0deg);
      }

    }


    @keyframes flipBottomShadow {

      0% {
        opacity: 1;
      }

      55% {
        opacity: 0.38;
      }

      100% {
        opacity: 0;
      }

    }


    /* =========================================
       РОЗДІЛЮВАЧ ТИСЯЧ
    ========================================= */

    .digit-separator {
      width: 20px;

      display: flex;
      align-items: center;
      justify-content: center;

      font-family: 'Orbitron', sans-serif;

      font-size: 43px;
      font-weight: 700;

      color: var(--orange);

      text-shadow:
        0 0 7px var(--orange);

      transform: translateY(-2px);
    }



    /* =========================================
       ДОДАТКОВІ ВІКНА — HIGH CONTRAST
    ========================================= */

    .stats-row {
      width: 100%;

      display: grid;
      grid-template-columns: 1fr 1fr;

      gap: 16px;

      margin-top: 16px;
    }


    .stat-window {
      min-width: 0;

      overflow: hidden;

      background: #0b0b0b;

      border: 1px solid rgba(255, 165, 0, 0.48);
      border-radius: 10px;

      box-shadow:
        0 4px 10px rgba(0, 0, 0, 0.52),
        inset 0 0 0 1px rgba(255, 255, 255, 0.015);
    }


    .stat-title {
      margin: 0;

      padding: 9px 10px 8px;

      background:
        linear-gradient(
          to bottom,
          #202020,
          #151515
        );

      border-bottom: 2px solid var(--orange);

      font-family: 'Roboto Condensed', Arial, sans-serif;
      font-size: 15px;
      line-height: 1;
      font-weight: 700;

      text-align: center;

      color: #f0f0f0;

      letter-spacing: 0.7px;

      text-shadow:
        0 1px 1px #000;
    }


    .stat-display {
      position: relative;

      min-height: 72px;

      display: flex;
      align-items: center;
      justify-content: center;

      margin: 10px;

      overflow: hidden;

      background:
        linear-gradient(
          to bottom,
          #111111 0%,
          #050505 100%
        );

      border: 1px solid #303030;
      border-radius: 7px;

      box-shadow:
        inset 0 8px 16px rgba(255, 255, 255, 0.025),
        inset 0 -12px 18px rgba(0, 0, 0, 0.72),
        0 2px 5px rgba(0, 0, 0, 0.75);
    }


    .stat-display::after {
      content: "";

      position: absolute;

      left: 0;
      right: 0;
      top: 50%;

      height: 1px;

      background: rgba(255, 255, 255, 0.055);

      box-shadow:
        0 1px 0 rgba(0, 0, 0, 0.95);

      pointer-events: none;
    }


    .stat-value {
      position: relative;

      z-index: 2;

      width: 100%;

      padding: 0 8px;

      font-family: 'Roboto Mono', Consolas, monospace;
      font-size: 39px;
      line-height: 1;
      font-weight: 700;

      text-align: center;

      color: #ffffff;

      letter-spacing: 0.5px;

      font-variant-numeric: tabular-nums;

      text-shadow:
        0 2px 2px rgba(0, 0, 0, 1);
    }


    .stat-unit {
      margin: -2px 0 10px;

      font-family: 'Roboto Condensed', Arial, sans-serif;
      font-size: 10px;
      line-height: 1;
      font-weight: 700;

      text-align: center;

      color: rgba(255, 165, 0, 0.88);

      letter-spacing: 1.8px;
      text-transform: uppercase;
    }


    .stat-window:first-child .stat-title {
      color: #dfffe0;
    }

    .stat-window:first-child .stat-value {
      color: #8cff9a;
      text-shadow:
        0 2px 2px rgba(0, 0, 0, 1),
        0 0 8px rgba(80, 255, 120, 0.18);
    }

    .stat-window:first-child .stat-unit {
      color: rgba(140, 255, 154, 0.82);
    }


    .stat-window:last-child .stat-title {
      color: #ffb21f;
    }

    .stat-window:last-child .stat-value {
      color: #ffd36a;
      text-shadow:
        0 2px 2px rgba(0, 0, 0, 1),
        0 0 8px rgba(255, 179, 37, 0.18);
    }

    .stat-window:last-child .stat-unit {
      color: rgba(255, 186, 59, 0.88);
    }


    .stat-value {
      transition:
        text-shadow 0.18s ease,
        filter 0.18s ease;
    }


    /* =========================================
       НИЖНІЙ БЛОК
    ========================================= */

    .menu-list {
      width: 100%;

      margin-top: 13px;

      padding: 9px 15px;

      background: rgba(0, 0, 0, 0.24);

      border: 1px solid rgba(255, 165, 0, 0.20);

      border-radius: 10px;

      text-align: center;

      color: #cccccc;

      text-shadow:
        0 0 3px black;
    }


    .menu-title {
      font-size: 25px;
      font-weight: 700;

      margin-bottom: 5px;
    }


    .donate-line {
      font-family: Arial, sans-serif;

      font-size: 27px;
      font-weight: 600;
    }


    .highlight {
      color: #ff9900;

      text-shadow:
        0 0 5px rgba(255, 153, 0, 0.4);
    }


    /* =========================================
       ПІДСВІЧУВАННЯ ПІД ЧАС ВІДЛІКУ
    ========================================= */

    .main-flip-board.counting {
      animation:
        boardGlow 0.75s ease-in-out infinite alternate;
    }


    @keyframes boardGlow {

      from {
        box-shadow:
          inset 0 0 10px rgba(255, 165, 0, 0.25),
          0 0 4px rgba(255, 165, 0, 0.15);
      }

      to {
        box-shadow:
          inset 0 0 13px rgba(255, 165, 0, 0.40),
          0 0 12px rgba(255, 165, 0, 0.50);
      }

    }

  </style>
</head>


<body>

  <div class="widget-box">

    <div class="header-text">
      💰 Залишилось нафармити 💰
    </div>


    <div
      class="main-flip-board"
      id="mainBoard">
    </div>

    <div class="stats-row">

      <div class="stat-window">
        <div class="stat-title">ВЖЕ НАФАРМИВ</div>

        <div class="stat-display">
          <div class="stat-value" id="farmedValue">—</div>
        </div>

        <div class="stat-unit">срібла</div>
      </div>


      <div class="stat-window">
        <div class="stat-title">ДОДАЛИ ГЛЯДАЧІ</div>

        <div class="stat-display">
          <div class="stat-value" id="goalValue">—</div>
        </div>

        <div class="stat-unit">срібла</div>
      </div>

    </div>


    <div class="menu-list">

      <div class="menu-title">

        <span class="highlight">
          Глядачі можуть впливати на стрім
        </span>

      </div>


      <div class="donate-line">

        💰 За кожну 1 грн —

        <span class="highlight">
          +1 000
        </span>

        срібла

      </div>

    </div>

  </div>



  <script>

    /* =========================================
       GOOGLE SHEETS
    ========================================= */

    const SHEET_ID =
      '17phnEn-NW-OnrZg4DcW65r-Xoq6ScsdVjS5yL0SS3fk';


    const SHEET_NAME =
      'FARM';


    const CELL_RANGE =
      'C10';



    /* =========================================
       НАЛАШТУВАННЯ
    ========================================= */


    /*
      Мінімальний крок.

      Маленькі зміни будуть рахуватись:

      1000
      900
      800
      700...
    */

    const MIN_COUNT_STEP = 1;


    /*
      Максимальна кількість переходів.

      Навіть якщо різниця 100 000,
      він НЕ робитиме 1000 фліпів.

      Він автоматично збільшить крок.
    */

    const MAX_ANIMATION_STEPS = 30;


    /*
      Орієнтовна максимальна
      тривалість відліку.

      3600 = 3.6 секунди
    */

    const COUNT_DURATION = 650;


    /*
      Google Sheets перевіряємо
      КОЖНІ 5 СЕКУНД
    */

    const UPDATE_INTERVAL = 5000;


    /*
      Мінімальна пауза між
      окремими flip-переходами.

      Це важливо, щоб механічний
      flip встигав завершитися.
    */

    const MIN_STEP_DELAY = 0;



    /* =========================================
       VARIABLES
    ========================================= */

    let currentValue = null;

    let displayedValue = null;

    let latestTargetValue = null;

    let currentBoardString = '';

    let boardDigits = [];

    let countTimer = null;

    let animationRunning = false;

    let pendingValue = null;

    let boardAnimationToken = 0;

    let farmedDisplayedValue = 0;
    let goalDisplayedValue = 0;

    let farmedAnimationFrame = null;
    let goalAnimationFrame = null;


    const mainBoard =
      document.getElementById('mainBoard');

    const farmedValue =
      document.getElementById('farmedValue');

    const goalValue =
      document.getElementById('goalValue');



    /* =========================================
       HTML ОДНІЄЇ ЦИФРИ
    ========================================= */

    function makeDigitHTML(value) {

      return `

        <div class="digit-half top static-top">
          <div class="digit-num">${value}</div>
        </div>

        <div class="digit-half bottom static-bottom">
          <div class="digit-num">${value}</div>
        </div>

        <div class="digit-half top flip-top">
          <div class="digit-num">${value}</div>
        </div>

        <div class="digit-half bottom flip-bottom">
          <div class="digit-num">${value}</div>
        </div>

      `;

    }



    /* =========================================
       ЗМІНА ТЕКСТУ ЦИФРИ
    ========================================= */

    function setDigitText(
      digitEl,
      selector,
      value
    ) {

      const node =
        digitEl.querySelector(selector);


      if (node) {

        node.textContent =
          value;

      }

    }



    /* =========================================
       FLIP ОДНІЄЇ ЦИФРИ
    ========================================= */

    function flipDigit(
      digitEl,
      oldValue,
      newValue
    ) {

      /*
        Якщо цифра не змінилася —
        нічого не робимо.
      */

      if (
        oldValue === newValue
      ) {

        return;

      }


      digitEl.classList.remove(
        'play'
      );


      /*
        Примусовий reflow,
        щоб CSS-анімація
        запустилася повторно.
      */

      void digitEl.offsetWidth;


      /*
        ФІЗИЧНО ПРАВИЛЬНІ ШАРИ FLIP:

        static-top    = вже НОВА верхня половина
        static-bottom = ще СТАРА нижня половина
        flip-top      = СТАРА верхня пластина, яка падає
        flip-bottom   = НОВА нижня пластина, яка розкривається

        Саме це створює ефект справжнього механічного перевороту.
      */

      setDigitText(
        digitEl,
        '.static-top .digit-num',
        newValue
      );


      setDigitText(
        digitEl,
        '.static-bottom .digit-num',
        oldValue
      );


      setDigitText(
        digitEl,
        '.flip-top .digit-num',
        oldValue
      );


      setDigitText(
        digitEl,
        '.flip-bottom .digit-num',
        newValue
      );


      /*
        Запускаємо FLIP
      */

      digitEl.classList.add(
        'play'
      );


      clearTimeout(
        digitEl._flipTimer
      );


      /*
        Після завершення
        встановлюємо нове число.
      */

      digitEl._flipTimer =
        setTimeout(() => {


          setDigitText(
            digitEl,
            '.static-top .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.static-bottom .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.flip-top .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.flip-bottom .digit-num',
            newValue
          );


          digitEl.dataset.value =
            newValue;


          digitEl.classList.remove(
            'play'
          );


        }, 720);

    }



    /* =========================================
       ФОРМАТ ЧИСЛА
    ========================================= */

    function formatBoardValue(value) {

      return String(
        Math.max(
          0,
          Math.round(value)
        )
      );

    }



    /* =========================================
       СТВОРЕННЯ ВСЬОГО FLIP BOARD
    ========================================= */

    function buildBoardFromString(str) {

      mainBoard.innerHTML =
        '';


      boardDigits =
        [];


      for (
        let i = 0;
        i < str.length;
        i++
      ) {


        /*
          Розділювач:

          12’345’678
        */

        if (
          i > 0 &&
          (str.length - i) % 3 === 0
        ) {

          const separator =
            document.createElement('div');


          separator.className =
            'digit-separator';


          separator.textContent =
            '’';


          mainBoard.appendChild(
            separator
          );

        }


        const ch =
          str[i];


        const digit =
          document.createElement('div');


        digit.className =
          'flip-digit';


        digit.dataset.value =
          ch;


        digit.innerHTML =
          makeDigitHTML(ch);


        mainBoard.appendChild(
          digit
        );


        boardDigits.push(
          digit
        );

      }


      currentBoardString =
        str;

    }


    function buildMainBoard(value) {

      const str =
        formatBoardValue(value);


      buildBoardFromString(
        str
      );

    }



    /* =========================================
       ОНОВЛЕННЯ FLIP BOARD
    ========================================= */

    function updateMainBoard(
      value,
      animate = true
    ) {

      const nextStr =
        formatBoardValue(value);


      /*
        Якщо змінилася кількість цифр:

        999 900
        ->
        1 000 000

        просто перебудовуємо табло.
      */

      if (
        !currentBoardString ||
        nextStr.length !==
        currentBoardString.length
      ) {

        buildMainBoard(value);

        return;

      }


      /*
        Перевіряємо всі цифри.
      */

      for (
        let i = 0;
        i < nextStr.length;
        i++
      ) {

        const oldValue =
          currentBoardString[i];


        const newValue =
          nextStr[i];


        if (
          oldValue ===
          newValue
        ) {

          continue;

        }


        const digitEl =
          boardDigits[i];


        if (animate) {

          flipDigit(
            digitEl,
            oldValue,
            newValue
          );

        }

        else {

          setDigitText(
            digitEl,
            '.static-top .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.static-bottom .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.flip-top .digit-num',
            newValue
          );


          setDigitText(
            digitEl,
            '.flip-bottom .digit-num',
            newValue
          );


          digitEl.dataset.value =
            newValue;

        }

      }


      currentBoardString =
        nextStr;

    }



    /* =========================================
       ВИЗНАЧЕННЯ АДАПТИВНОГО КРОКУ
    ========================================= */

    function calculateStep(difference) {

      /*
        Реальний крок лічильника = 1.

        Тепер число проходить:
        123456
        123457
        123458
        ...

        Тому одиниці, десятки, сотні
        та всі старші розряди реально
        беруть участь у flip-анімації.
      */

      return 1;

    }


    /* =========================================
       AIRPORT / SOLARI ДОПОМІЖНІ ФУНКЦІЇ
    ========================================= */

    function sleep(ms) {

      return new Promise(resolve =>
        setTimeout(resolve, ms)
      );

    }


    function setDigitImmediate(
      digitEl,
      value
    ) {

      setDigitText(
        digitEl,
        '.static-top .digit-num',
        value
      );


      setDigitText(
        digitEl,
        '.static-bottom .digit-num',
        value
      );


      setDigitText(
        digitEl,
        '.flip-top .digit-num',
        value
      );


      setDigitText(
        digitEl,
        '.flip-bottom .digit-num',
        value
      );


      digitEl.dataset.value =
        value;

    }


    function spinDigitToValue(
      digitEl,
      startDigit,
      targetDigit,
      stopDelay,
      token
    ) {

      /*
        AIRPORT BOARD:

        УСІ цифри стартують ОДНОЧАСНО.

        Потім:
        1-а цифра зупиняється першою,
        2-а — через ~1 секунду,
        3-я — ще через ~1 секунду,
        і так далі.

        Ніяких while / for:
        кожен flip запускається через setTimeout.
      */

      return new Promise(resolve => {

        let currentDigit =
          Number(startDigit);


        const finalDigit =
          Number(targetDigit);


        if (
          !Number.isFinite(currentDigit) ||
          !Number.isFinite(finalDigit)
        ) {

          setDigitImmediate(
            digitEl,
            targetDigit
          );

          resolve();

          return;

        }


        const startedAt =
          performance.now();


        /*
          Швидкість постійного прокручування
          одного розряду.
        */

        const SPIN_INTERVAL =
          430;


        function finishOnTarget() {

          if (
            token !==
            boardAnimationToken
          ) {

            resolve();

            return;

          }


          if (
            currentDigit ===
            finalDigit
          ) {

            setDigitImmediate(
              digitEl,
              String(finalDigit)
            );

            resolve();

            return;

          }


          /*
            Останній механічний flip
            прямо на потрібну цифру.
          */

          flipDigit(
            digitEl,
            String(currentDigit),
            String(finalDigit)
          );


          currentDigit =
            finalDigit;


          setTimeout(() => {

            if (
              token ===
              boardAnimationToken
            ) {

              setDigitImmediate(
                digitEl,
                String(finalDigit)
              );

            }


            resolve();

          }, 760);

        }


        function spin() {

          if (
            token !==
            boardAnimationToken
          ) {

            resolve();

            return;

          }


          const elapsed =
            performance.now() -
            startedAt;


          /*
            Настав час цього розряду
            "зафіксуватися" на правильній цифрі.
          */

          if (
            elapsed >=
            stopDelay
          ) {

            finishOnTarget();

            return;

          }


          const nextDigit =
            (currentDigit + 1) % 10;


          flipDigit(
            digitEl,
            String(currentDigit),
            String(nextDigit)
          );


          currentDigit =
            nextDigit;


          setTimeout(
            spin,
            SPIN_INTERVAL
          );

        }


        /*
          ВАЖЛИВО:
          усі розряди запускаються одразу.
        */

        spin();

      });

    }

    /* =========================================
       АНІМОВАНИЙ ВІДЛІК
    ========================================= */

    async function animateCounter(
      startValue,
      targetValue
    ) {

      /*
        РЕЖИМ AIRPORT / SOLARI:

        УСІ потрібні розряди стартують одночасно,
        а потім зупиняються по одному зліва направо.

        ВАЖЛИВО:
        якщо довжина числа змінюється
        (наприклад 1 000 000 -> 950 000),
        ми НЕ перемальовуємо табло одразу.

        Замість цього:
        1) приводимо старе і нове число до однакової довжини
           за допомогою нулів зліва;
        2) анімуємо перехід;
        3) після завершення прибираємо зайві нулі зліва.
      */

      boardAnimationToken += 1;

      const token =
        boardAnimationToken;


      if (
        startValue ===
        targetValue
      ) {

        currentValue =
          targetValue;

        displayedValue =
          targetValue;

        animationRunning =
          false;

        return;

      }


      animationRunning =
        true;


      mainBoard.classList.add(
        'counting'
      );


      const rawOldStr =
        currentBoardString ||
        formatBoardValue(startValue);


      const rawNextStr =
        formatBoardValue(targetValue);


      const workLength =
        Math.max(
          rawOldStr.length,
          rawNextStr.length
        );


      const oldStr =
        rawOldStr.padStart(
          workLength,
          '0'
        );


      const nextStr =
        rawNextStr.padStart(
          workLength,
          '0'
        );


      /*
        Якщо довжина не збігається з поточною дошкою,
        перебудовуємо її ПІД padded-рядок,
        а не під фінальне коротке число.
      */

      if (
        !currentBoardString ||
        currentBoardString.length !==
        workLength
      ) {

        buildBoardFromString(
          oldStr
        );

      }

      else if (
        currentBoardString !==
        oldStr
      ) {

        buildBoardFromString(
          oldStr
        );

      }


      const jobs = [];

      let changedOrder = 0;


      for (
        let i = 0;
        i < nextStr.length;
        i++
      ) {

        const oldDigit =
          oldStr[i];


        const newDigit =
          nextStr[i];


        const digitEl =
          boardDigits[i];


        if (
          oldDigit ===
          newDigit
        ) {

          setDigitImmediate(
            digitEl,
            newDigit
          );

          continue;

        }


        /*
          УСІ цифри стартують одночасно.

          Зупинка йде зліва направо:
          1-а приблизно через 1.8 с,
          2-а через 2.8 с,
          3-я через 3.8 с,
          і так далі.
        */

        const stopDelay =
          1800 +
          changedOrder * 1000;


        jobs.push(
          spinDigitToValue(
            digitEl,
            oldDigit,
            newDigit,
            stopDelay,
            token
          )
        );


        changedOrder += 1;

      }


      await Promise.all(
        jobs
      );


      if (
        token !==
        boardAnimationToken
      ) {

        return;

      }


      /*
        Спочатку закінчуємо анімацію на робочому padded-рядку.
      */

      currentBoardString =
        nextStr;


      currentValue =
        targetValue;


      displayedValue =
        targetValue;


      /*
        Потім, якщо треба, прибираємо лідируючі нулі
        й показуємо реальну довжину числа.
      */

      if (
        nextStr !== rawNextStr
      ) {

        buildMainBoard(
          targetValue
        );

      }


      animationRunning =
        false;


      mainBoard.classList.remove(
        'counting'
      );


      if (
        pendingValue !== null &&
        pendingValue !==
        currentValue
      ) {

        const next =
          pendingValue;


        pendingValue =
          null;


        animateCounter(
          displayedValue,
          next
        );

      }

      else {

        pendingValue =
          null;

      }

    }


    /* =========================================
       ДОДАТКОВІ ДАНІ GOOGLE SHEETS
    ========================================= */

    function formatStatNumber(value) {

      return Math.max(
        0,
        Math.round(
          Number(value) || 0
        )
      )
        .toLocaleString('uk-UA')
        .replace(/\s/g, '’');

    }


    async function fetchSheetJson(
      sheetName,
      range
    ) {

      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?tqx=out:json` +
        `&sheet=${encodeURIComponent(sheetName)}` +
        `&range=${encodeURIComponent(range)}` +
        `&_=${Date.now()}`;


      const response =
        await fetch(
          url,
          {
            cache: 'no-store'
          }
        );


      if (
        !response.ok
      ) {

        throw new Error(
          `HTTP ${response.status}`
        );

      }


      const rawText =
        await response.text();


      const start =
        rawText.indexOf('{');


      const end =
        rawText.lastIndexOf('}') + 1;


      if (
        start === -1 ||
        end <= start
      ) {

        throw new Error(
          'Некоректна відповідь Google Sheets'
        );

      }


      return JSON.parse(
        rawText.substring(
          start,
          end
        )
      );

    }


    function animateStatNumber(
      element,
      targetValue,
      type
    ) {

      const target =
        Math.max(
          0,
          Math.round(
            Number(targetValue) || 0
          )
        );


      let current =
        type === 'farmed'
          ? farmedDisplayedValue
          : goalDisplayedValue;


      const oldFrame =
        type === 'farmed'
          ? farmedAnimationFrame
          : goalAnimationFrame;


      if (
        oldFrame !== null
      ) {

        cancelAnimationFrame(
          oldFrame
        );

      }


      if (
        current === target
      ) {

        element.textContent =
          formatStatNumber(target);

        return;

      }


      const startValue =
        current;


      const difference =
        target -
        startValue;


      /*
        Тривалість анімації.

        Великі зміни не будуть тривати
        десятки секунд — максимум ~1.8 с.
      */

      const duration =
        Math.min(
          15000,
          Math.max(
            5000,
            Math.abs(difference) / 100
          )
        );


      const startedAt =
        performance.now();


      function easeOutCubic(t) {

        return 1 -
          Math.pow(
            1 - t,
            3
          );

      }


      function frame(now) {

        const elapsed =
          now -
          startedAt;


        const progress =
          Math.min(
            1,
            elapsed / duration
          );


        const eased =
          easeOutCubic(
            progress
          );


        current =
          Math.round(
            startValue +
            difference * eased
          );


        element.textContent =
          formatStatNumber(current);


        if (
          type === 'farmed'
        ) {

          farmedDisplayedValue =
            current;

        }

        else {

          goalDisplayedValue =
            current;

        }


        if (
          progress < 1
        ) {

          const id =
            requestAnimationFrame(
              frame
            );


          if (
            type === 'farmed'
          ) {

            farmedAnimationFrame =
              id;

          }

          else {

            goalAnimationFrame =
              id;

          }

          return;

        }


        element.textContent =
          formatStatNumber(target);


        if (
          type === 'farmed'
        ) {

          farmedDisplayedValue =
            target;

          farmedAnimationFrame =
            null;

        }

        else {

          goalDisplayedValue =
            target;

          goalAnimationFrame =
            null;

        }

      }


      const id =
        requestAnimationFrame(
          frame
        );


      if (
        type === 'farmed'
      ) {

        farmedAnimationFrame =
          id;

      }

      else {

        goalAnimationFrame =
          id;

      }

    }



    async function fetchGoalValue() {

      try {

        const json =
          await fetchSheetJson(
            'FARM',
            'C6'
          );


        const raw =
          json?.table
              ?.rows?.[0]
              ?.c?.[0]
              ?.v;


        const value =
          Number(raw);


        if (
          !Number.isFinite(value)
        ) {

          throw new Error(
            'FARM!C6 не є числом'
          );

        }


        animateStatNumber(
          goalValue,
          value,
          'goal'
        );

      }

      catch (error) {

        console.error(
          'Помилка FARM!C6:',
          error
        );


        goalValue.textContent =
          '—';

      }

    }


    async function fetchFarmedSum() {

      try {

        const json =
          await fetchSheetJson(
            'WOT Credits Tracker',
            'H:H'
          );


        const rows =
          json?.table?.rows || [];


        const sum =
          rows.reduce(
            (total, row) => {

              const value =
                Number(
                  row?.c?.[0]?.v
                );


              return Number.isFinite(value)
                ? total + value
                : total;

            },
            0
          );


        animateStatNumber(
          farmedValue,
          sum,
          'farmed'
        );

      }

      catch (error) {

        console.error(
          'Помилка WOT Credits Tracker!H:H:',
          error
        );


        farmedValue.textContent =
          '—';

      }

    }


    async function fetchExtraStats() {

      await Promise.allSettled([
        fetchGoalValue(),
        fetchFarmedSum()
      ]);

    }



    /* =========================================
       GOOGLE SHEETS
    ========================================= */

    async function fetchSilver() {

      /*
        Додаємо timestamp,
        щоб браузер/OBS не віддавав
        стару кешовану відповідь.
      */

      const cacheBust =
        Date.now();


      const url =
        `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq` +
        `?tqx=out:json` +
        `&sheet=${encodeURIComponent(SHEET_NAME)}` +
        `&range=${CELL_RANGE}` +
        `&_=${cacheBust}`;


      try {

        const response =
          await fetch(
            url,
            {
              cache: 'no-store'
            }
          );


        if (
          !response.ok
        ) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const text =
          await response.text();


        const start =
          text.indexOf('{');


        const end =
          text.lastIndexOf('}') + 1;


        if (
          start === -1 ||
          end <= start
        ) {

          throw new Error(
            'Google Sheets повернув некоректну відповідь'
          );

        }


        const json =
          JSON.parse(
            text.substring(
              start,
              end
            )
          );


        const rawValue =
          json?.table
              ?.rows?.[0]
              ?.c?.[0]
              ?.v;


        if (
          rawValue === null ||
          rawValue === undefined
        ) {

          return;

        }


        const newValue =
          Math.max(
            0,
            Math.round(
              Number(rawValue)
            )
          );


        if (
          !Number.isFinite(
            newValue
          )
        ) {

          return;

        }


        /*
          Запам'ятовуємо найновіше
          значення з таблиці.
        */

        latestTargetValue =
          newValue;


        /* =====================================
           ПЕРШИЙ ЗАПУСК
        ===================================== */

        if (
          currentValue === null
        ) {

          currentValue =
            newValue;


          displayedValue =
            newValue;


          buildMainBoard(
            newValue
          );


          return;

        }


        /* =====================================
           ЯКЩО ВЖЕ ЙДЕ АНІМАЦІЯ
        ===================================== */

        if (
          animationRunning
        ) {

          /*
            Просто запам'ятовуємо
            найновішу ціль.
          */

          pendingValue =
            newValue;


          return;

        }


        /* =====================================
           НІЧОГО НЕ ЗМІНИЛОСЬ
        ===================================== */

        if (
          newValue ===
          displayedValue
        ) {

          currentValue =
            newValue;


          return;

        }


        /* =====================================
           ЗАПУСК НОВОЇ АНІМАЦІЇ
        ===================================== */

        animateCounter(
          displayedValue,
          newValue
        );

      }

      catch (error) {

        console.error(
          'Помилка Google Sheets:',
          error
        );

      }

    }



    /* =========================================
       START
    ========================================= */

    fetchSilver();
    fetchExtraStats();


    /*
      ПЕРЕВІРКА КОЖНІ 5 СЕКУНД
    */

    setInterval(
      fetchSilver,
      UPDATE_INTERVAL
    );

    setInterval(
      fetchExtraStats,
      UPDATE_INTERVAL
    );

  </script>
